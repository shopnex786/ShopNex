<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopNex - Online Shopping</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6fb;color:#172033}
header{background:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #ddd}
.logo{font-size:27px;font-weight:bold;color:#1769e0}
button{cursor:pointer;border:0;border-radius:8px;padding:12px;background:#1769e0;color:white}
input,select{padding:13px;border:1px solid #ddd;border-radius:8px;width:100%;margin:7px 0}
.hero{background:linear-gradient(120deg,#0754c7,#3995ff);color:white;text-align:center;padding:55px 15px}
.hero h1{font-size:38px}
.search{max-width:500px;background:white}
h2{text-align:center;margin:30px 10px}
.categories{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.categories button{background:white;color:#1769e0}
.products{padding:15px 5%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:17px}
.card{background:white;padding:12px;border-radius:14px;box-shadow:0 3px 12px #ddd}
.card img{width:100%;height:155px;object-fit:cover;border-radius:10px}
.card h3{font-size:16px}
.price{font-size:20px;font-weight:bold;color:#1769e0}
.card button{width:100%}
